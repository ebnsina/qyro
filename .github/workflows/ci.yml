name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types and the skill
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build the library
        run: pnpm build
      - name: Build the site and check its AI files
        run: pnpm --filter qyro-site build
      - name: Browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
